---
# Run on the hosting server:
# ansible-playbook -i localhost, -c local ansible/install-numerology-zodiac.yml
# Keeps the existing database and Nginx/TLS configuration; creates an HTTP vhost if absent.
# New TLS certificate (requires correct DNS): -e enable_tls=true -e certbot_email=YOU@example.com
- name: Install Nekked Dating numerology and zodiac features
  hosts: all
  become: true
  gather_facts: true
  vars:
    nekked_repo: https://github.com/olamidebello/Nekked-Dating.git
    nekked_version: main
    nekked_domain: nekkeddating.com
    nekked_port: 18083
    nekked_service: nekkeddating
    nekked_user: nekkeddating
    nekked_base: /var/lib/olamide-github-deploy
    nekked_source: '{{ nekked_base }}/sources/{{ nekked_domain }}'
    nekked_data: /var/lib/nekkeddating
    nekked_current: /opt/nekkeddating-github-current
    nekked_vhost: '/etc/nginx/sites-available/olamide-auto-{{ nekked_domain }}'
    enable_tls: false
    certbot_email: ''
  pre_tasks:
    - name: Validate target configuration
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - nekked_domain is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?[.])+[a-z]{2,63}$')
          - nekked_service is match('^[a-z][a-z0-9_-]*$')
          - nekked_user is match('^[a-z][a-z0-9_-]*$')
          - nekked_port | int > 1024
          - nekked_port | int < 65536
          - not enable_tls | bool or certbot_email is match('^[^ @]+@[^ @]+[.][^ @]+$')
    - name: Require actual deployment mode
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Use --syntax-check. Release tests and health checks require a real deployment.
  tasks:
    - name: Install runtime, version control and reverse proxy
      ansible.builtin.apt:
        name: [git, python3, nginx, ca-certificates]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Create application account
      ansible.builtin.user:
        name: '{{ nekked_user }}'
        system: true
        create_home: false
        shell: /usr/sbin/nologin
    - name: Create release, source and protected backup directories
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: directory
        mode: '{{ item.mode }}'
        owner: root
        group: root
      loop:
        - {path: '{{ nekked_base }}', mode: '0755'}
        - {path: '{{ nekked_base }}/sources', mode: '0700'}
        - {path: '{{ nekked_base }}/releases', mode: '0755'}
        - {path: '{{ nekked_base }}/releases/{{ nekked_service }}', mode: '0755'}
        - {path: '{{ nekked_base }}/backups', mode: '0700'}
    - name: Create persistent application data directory
      ansible.builtin.file:
        path: '{{ nekked_data }}'
        state: directory
        owner: '{{ nekked_user }}'
        group: '{{ nekked_user }}'
        mode: '0700'
    - name: Verify existing Nginx configuration
      ansible.builtin.command: nginx -t
      changed_when: false
    - name: Acquire shared deployment lock and run isolated installer
      block:
        - name: Acquire deployment lock used by hourly updater
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import fcntl, os, subprocess, sys
                from pathlib import Path
                lock=Path(sys.argv[1]); lock.parent.mkdir(parents=True,exist_ok=True)
                with lock.open('a') as handle:
                    try: fcntl.flock(handle,fcntl.LOCK_EX|fcntl.LOCK_NB)
                    except BlockingIOError: raise SystemExit('Another deployment is running. Retry after it finishes.')
                    # Hold this lock in a small detached process until the lease file is removed.
                    lease=Path(sys.argv[2]); lease.write_text('held')
                    pid=os.fork()
                    if pid: raise SystemExit(0)
                    os.setsid()
                    dev=os.open(os.devnull,os.O_RDWR)
                    for fd in (0,1,2): os.dup2(dev,fd)
                    import time
                    deadline=time.monotonic()+1800
                    while lease.exists() and time.monotonic()<deadline: time.sleep(1)
              - '{{ nekked_base }}/worker.lock'
              - '{{ nekked_base }}/numerology-install.lease'
          changed_when: false
          register: lock_claim
        - name: Pull requested repository version without discarding local changes
          ansible.builtin.git:
            repo: '{{ nekked_repo }}'
            dest: '{{ nekked_source }}'
            version: '{{ nekked_version }}'
            update: true
            force: false
          register: checkout
        - name: Set immutable release and backup paths
          ansible.builtin.set_fact:
            nekked_release: '{{ nekked_base }}/releases/{{ nekked_service }}/{{ checkout.after }}'
            nekked_backup: '{{ nekked_base }}/backups/{{ nekked_domain }}/numerology-{{ ansible_facts.date_time.epoch }}'
        - name: Create immutable release directory
          ansible.builtin.file:
            path: '{{ nekked_release }}'
            state: directory
            mode: '0755'
        - name: Export tracked source to release archive
          ansible.builtin.command:
            argv: [git, archive, '--format=tar', '--output={{ nekked_base }}/sources/nekked-release.tar', '{{ checkout.after }}']
            chdir: '{{ nekked_source }}'
          changed_when: true
        - name: Expand release archive
          ansible.builtin.unarchive:
            src: '{{ nekked_base }}/sources/nekked-release.tar'
            dest: '{{ nekked_release }}'
            remote_src: true
            mode: 'u=rwX,go=rX'
        - name: Compile Python modules
          ansible.builtin.command:
            argv: [python3, -m, compileall, -q, '{{ nekked_release }}']
          changed_when: false
        - name: Run calculator, matching and authorization tests before switching
          ansible.builtin.command:
            argv: [python3, -m, unittest, discover, -s, tests, -v]
            chdir: '{{ nekked_release }}'
          changed_when: false
        - name: Inspect current release link
          ansible.builtin.stat:
            path: '{{ nekked_current }}'
            follow: false
          register: current
        - name: Refuse to overwrite a directory with a release link
          ansible.builtin.assert:
            that: not current.stat.exists or current.stat.islnk | default(false)
        - name: Inspect existing application service
          ansible.builtin.stat:
            path: '/etc/systemd/system/{{ nekked_service }}.service'
          register: unit
        - name: Save current service definition for rollback
          ansible.builtin.slurp:
            src: '/etc/systemd/system/{{ nekked_service }}.service'
          when: unit.stat.exists
          register: old_unit
        - name: Verify ownership of an existing service
          ansible.builtin.assert:
            that:
              - not unit.stat.exists or (old_unit.content | default('') | b64decode).startswith('# Managed by olamide-github-deploy') or (old_unit.content | default('') | b64decode).startswith('# Managed by Nekked feature installer')
            fail_msg: Existing service is unmanaged; refusing to replace its configuration.
        - name: Inspect existing reverse proxy
          ansible.builtin.stat:
            path: '{{ nekked_vhost }}'
          register: vhost
        - name: Refuse duplicate domain configuration on first install
          ansible.builtin.shell: |
            set -eu
            if nginx -T 2>&1 | python3 -c 'import re,sys; domain=sys.argv[1]; text=re.sub(r"#[^\n]*", "", sys.stdin.read()); names=[n.strip("\"\x27") for group in re.findall(r"\bserver_name\s+([^;]+);",text) for n in group.split()]; sys.exit(0 if domain in names else 1)' {{ nekked_domain | quote }}; then
              echo 'Domain already has a different Nginx configuration; refusing a duplicate.' >&2
              exit 1
            fi
          args:
            executable: /bin/bash
          when: not vhost.stat.exists
          changed_when: false
        - name: Record whether application was running
          ansible.builtin.command:
            argv: [systemctl, is-active, '{{ nekked_service }}']
          failed_when: false
          changed_when: false
          register: was_active
        - name: Create protected rollback directory
          ansible.builtin.file:
            path: '{{ nekked_backup }}'
            state: directory
            mode: '0700'
        - name: Save prior unit on disk
          ansible.builtin.copy:
            content: '{{ old_unit.content | b64decode }}'
            dest: '{{ nekked_backup }}/service.unit'
            mode: '0600'
          when: unit.stat.exists
        - name: Activate tested release and verify
          block:
            - name: Stop application before consistent database backup
              ansible.builtin.systemd:
                name: '{{ nekked_service }}'
                state: stopped
              when: unit.stat.exists
            - name: Back up existing SQLite database
              ansible.builtin.command:
                argv:
                  - python3
                  - -c
                  - |
                    import sqlite3,sys,os
                    from pathlib import Path
                    source=Path(sys.argv[1]); target=Path(sys.argv[2]); os.umask(0o077)
                    if source.exists():
                        with sqlite3.connect(source) as src,sqlite3.connect(target) as dst: src.backup(dst)
                  - '{{ nekked_data }}/nekked.sqlite3'
                  - '{{ nekked_backup }}/nekked.sqlite3'
              changed_when: true
            - name: Point service at tested release
              ansible.builtin.file:
                src: '{{ nekked_release }}'
                dest: '{{ nekked_current }}'
                state: link
            - name: Install hardened service with persistent database
              ansible.builtin.copy:
                dest: '/etc/systemd/system/{{ nekked_service }}.service'
                mode: '0644'
                content: |
                  # Managed by olamide-github-deploy v1
                  # Installed by Nekked feature installer
                  [Unit]
                  Description=Nekked Dating numerology and compatibility
                  After=network.target
                  [Service]
                  User={{ nekked_user }}
                  Group={{ nekked_user }}
                  WorkingDirectory={{ nekked_current }}
                  Environment=PYTHONDONTWRITEBYTECODE=1
                  Environment=NEKKED_HOST=127.0.0.1
                  Environment=PORT={{ nekked_port }}
                  Environment=NEKKED_DB={{ nekked_data }}/nekked.sqlite3
                  Environment=NEKKED_SECURE_COOKIE=1
                  Environment=NEKKED_ORIGIN=https://{{ nekked_domain }}
                  ExecStart=/usr/bin/python3 {{ nekked_current }}/server.py
                  Restart=on-failure
                  RestartSec=3
                  NoNewPrivileges=true
                  PrivateTmp=true
                  ProtectHome=true
                  ProtectSystem=strict
                  ReadWritePaths={{ nekked_data }}
                  UMask=0077
                  [Install]
                  WantedBy=multi-user.target
            - name: Start application
              ansible.builtin.systemd:
                name: '{{ nekked_service }}'
                enabled: true
                state: started
                daemon_reload: true
            - name: Verify new tools page is served by backend
              ansible.builtin.uri:
                url: 'http://127.0.0.1:{{ nekked_port }}/tools'
                return_content: true
                status_code: 200
              register: backend
              until: backend.status | default(0) == 200 and 'Life path' in (backend.content | default(''))
              retries: 15
              delay: 2
            - name: Verify private calculator remains protected
              ansible.builtin.uri:
                url: 'http://127.0.0.1:{{ nekked_port }}/api/numerology/me'
                status_code: 401
          rescue:
            - name: Stop failed release
              ansible.builtin.systemd:
                name: '{{ nekked_service }}'
                state: stopped
              failed_when: false
            - name: Restore previous release link
              ansible.builtin.file:
                src: '{{ current.stat.lnk_source }}'
                dest: '{{ nekked_current }}'
                state: link
              when: current.stat.islnk | default(false)
            - name: Restore previous unit
              ansible.builtin.copy:
                content: '{{ old_unit.content | b64decode }}'
                dest: '/etc/systemd/system/{{ nekked_service }}.service'
                mode: '0644'
              when: unit.stat.exists
            - name: Remove first-install unit if there was no prior service
              ansible.builtin.file:
                path: '/etc/systemd/system/{{ nekked_service }}.service'
                state: absent
              when: not unit.stat.exists
            - name: Restart previous working service
              ansible.builtin.systemd:
                name: '{{ nekked_service }}'
                state: started
                daemon_reload: true
              when: unit.stat.exists and was_active.stdout == 'active'
            - name: Report failed activation and preserved database backup
              ansible.builtin.fail:
                msg: 'Activation failed; prior code/unit restored when present. Database backup is at {{ nekked_backup }}. Database rollback is not automatic.'
        - name: Create HTTP reverse proxy only if no existing vhost
          ansible.builtin.copy:
            dest: '{{ nekked_vhost }}'
            mode: '0644'
            content: |
              # Managed by olamide-github-deploy v1
              server {
                  listen 80;
                  server_name {{ nekked_domain }};
                  client_max_body_size 1m;
                  location / {
                      proxy_pass http://127.0.0.1:{{ nekked_port }};
                      proxy_set_header Host $host;
                      proxy_set_header X-Forwarded-Proto $scheme;
                  }
              }
          when: not vhost.stat.exists
        - name: Enable newly created vhost
          ansible.builtin.file:
            src: '{{ nekked_vhost }}'
            dest: '/etc/nginx/sites-enabled/olamide-auto-{{ nekked_domain }}'
            state: link
          when: not vhost.stat.exists
        - name: Validate reverse proxy
          ansible.builtin.command: nginx -t
          changed_when: false
        - name: Reload reverse proxy
          ansible.builtin.systemd:
            name: nginx
            state: reloaded
            enabled: true
        - name: Install certificate tooling when requested
          ansible.builtin.apt:
            name: [certbot, python3-certbot-nginx]
            state: present
          when: enable_tls | bool
        - name: Enable trusted HTTPS with correct public DNS
          ansible.builtin.command:
            argv: [certbot, --nginx, --non-interactive, --agree-tos, --redirect, --keep-until-expiring, -m, '{{ certbot_email }}', -d, '{{ nekked_domain }}']
          when: enable_tls | bool
          changed_when: true
        - name: Verify public HTTPS tools page
          ansible.builtin.uri:
            url: 'https://{{ nekked_domain }}/tools'
            status_code: 200
            validate_certs: true
            return_content: true
          register: public_tools
          failed_when: public_tools.status != 200 or 'Numerology &amp; matching' not in public_tools.content
          when: enable_tls | bool
        - name: Summarize successful install
          ansible.builtin.debug:
            msg:
              - 'Installed tested commit {{ checkout.after }}; backend {{ nekked_port }} serves /tools.'
              - 'Database preserved at {{ nekked_data }}/nekked.sqlite3; backup {{ nekked_backup }}.'
              - 'Existing TLS/vhost preserved. On a fresh host enable TLS before signing in: secure cookies require HTTPS.'
              - 'Tools use Python standard library only. No external calculator account or API key is required.'
      always:
        - name: Release shared deployment lock lease
          ansible.builtin.file:
            path: '{{ nekked_base }}/numerology-install.lease'
            state: absent
          when: lock_claim is defined and lock_claim.rc | default(1) == 0
